[project]
name = "bolsillo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gasbis", email = "gasbis@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "bcrypt>=5.0.0",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.2.3",
    "reflex[db]>=0.9.12",
    "sqlmodel>=0.0.47",
]

[project.scripts]
bolsillo = "bolsillo:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
